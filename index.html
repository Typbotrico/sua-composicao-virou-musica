(()=>{'use strict';const c=window.QUIZ_CONFIG||{},content=document.getElementById('content'),next=document.getElementById('next'),back=document.getElementById('back'),progress=document.getElementById('progress');const genres=['Sertanejo','Gospel','Pagode','Samba','Forró','Piseiro','Arrocha','Funk','Rap','Trap','Pop','Rock','MPB','Axé','Reggae','Eletrônico','Brega / Tecnobrega','R&B / Soul','Romântico / Bolero','Infantil','Outro estilo'];let step=0,answers={material:null,package:null,style:null,confirmed:false};const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[ch]));const money=p=>Number((c.prices||{})[p]||(p==='A'?97:250));function track(name,params){if(typeof window.fbq==='function')window.fbq('track',name,params||{})}function trackCustom(name,params){if(typeof window.fbq==='function')window.fbq('trackCustom',name,params||{})}const funnelSeen=new Set(),contactsSeen=new Set();function funnelData(){const d={origem:'quiz_composicao'};if(answers.material)d.material=answers.material;if(answers.package){d.pacote=answers.package==='A'?'voz_ia_97':'voz_real_250';d.preco_pacote=money(answers.package)}return d}function markFunnel(name,key){const signature=name+':'+String(key||'');if(funnelSeen.has(signature))return;funnelSeen.add(signature);trackCustom(name,funnelData())}function showOfferTrack(){if(!answers.package)return;const key=answers.package,signature='oferta:'+key;if(funnelSeen.has(signature))return;funnelSeen.add(signature);const d=funnelData();track('ViewContent',{content_name:key==='A'?'Música voz IA - R$ 97':'Música voz real - R$ 250',content_ids:[key==='A'?'pacote_97_voz_ia':'pacote_250_voz_real'],content_type:'product',value:money(key),currency:'BRL',origem:d.origem,material:d.material});trackCustom('VisualizouOferta',d)}if(/^\d{8,20}$/.test(String(c.pixelId||''))){!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');window.fbq('init',c.pixelId);track('PageView')}function option(title,desc,value,selected){return '<button type="button" class="option '+(selected?'active':'')+'" data-value="'+esc(value)+'"><strong>'+esc(title)+'</strong>'+(desc?'<small>'+esc(desc)+'</small>':'')+'</button>'}function bind(field){content.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{answers[field]=b.dataset.value;if(field==='material')markFunnel('InformouMaterial',answers.material);if(field==='package'){answers.confirmed=false;markFunnel('EscolheuPacote',answers.package)}if(field==='style'&&answers.style==='Outro estilo')answers.style='';render()})}function audios(){const items=(c.demos||{})[answers.package]||[],x=items[0];if(!x)return '';return '<div class="mini-demo" title="'+esc(x.title)+'"><button type="button" id="demo-play" class="mini-play" aria-label="Ouvir demonstração: '+esc(x.title)+'" aria-pressed="false">▶ Ouvir</button><input type="range" id="demo-seek" class="mini-seek" min="0" max="1000" step="1" value="0" aria-label="Navegar na música de demonstração"><audio id="demo-audio" preload="metadata" playsinline src="'+esc(x.url)+'"></audio></div>'}function setupDemo(){const audio=document.getElementById('demo-audio'),play=document.getElementById('demo-play'),seek=document.getElementById('demo-seek');if(!audio)return;play.onclick=async()=>{if(!audio.paused){audio.pause();return}try{await audio.play()}catch(e){play.textContent='Erro no áudio'}};audio.onplay=()=>{markFunnel('OuviuAmostra',answers.package);play.textContent='❚❚ Pausar';play.setAttribute('aria-pressed','true')};audio.onpause=()=>{play.textContent='▶ Ouvir';play.setAttribute('aria-pressed','false')};audio.ontimeupdate=()=>{if(audio.duration>0&&Number.isFinite(audio.duration))seek.value=Math.round(audio.currentTime/audio.duration*1000)};seek.oninput=()=>{if(audio.duration>0&&Number.isFinite(audio.duration))audio.currentTime=audio.duration*Number(seek.value)/1000};audio.onended=()=>{seek.value=0};audio.onerror=()=>{play.textContent='Áudio indisponível';play.disabled=true}}function whats(){const n=String(c.whatsapp||'').replace(/\D/g,'').replace(/^55/,'');if(!/^\d{10,11}$/.test(n)){alert('WhatsApp ainda não configurado.');return}const a=answers.package==='A',price=money(answers.package);const msg=['Olá, Rico Dias! 🎵','Fiz o quiz Sua Composição Virou Música e quero iniciar minha produção.','','PACOTE: '+(a?'R$ '+price+' — MÚSICA COM VOZ DE IA E PLAYBACK':'R$ '+price+' — MÚSICA COM MINHA VOZ E PLAYBACK PROFISSIONAL'),'Material: '+answers.material,'Estilo musical: '+answers.style,'Prazo informado: '+(a?'até 12 horas para as 3 prévias após pagamento confirmado e envio do material completo; finalização após escolha da versão':'até 5 dias corridos após pagamento confirmado e envio de todos os materiais, incluindo minha voz'),'',a?'Entendi que vou escolher uma das 3 prévias e receber a música com voz de IA e o playback em WAV.':'Entendi que minha voz será integrada à produção, com tratamento vocal, mixagem, masterização e entrega em WAV.','Quero receber as orientações de pagamento e envio dos materiais pelo WhatsApp.'].join('\n');if(!contactsSeen.has(answers.package)){contactsSeen.add(answers.package);const d=funnelData();track('Contact',{content_name:answers.package==='A'?'WhatsApp - Pacote R$ 97':'WhatsApp - Pacote R$ 250',origem:d.origem,pacote:d.pacote,material:d.material,preco_pacote:d.preco_pacote});markFunnel('ClicouWhatsApp',answers.package)}location.href='https://wa.me/55'+n+'?text='+encodeURIComponent(msg)}function render(){const oldAudio=document.getElementById('demo-audio');if(oldAudio)oldAudio.pause();progress.style.width=[0,25,50,75,100][step]+'%';back.hidden=step===0;content.scrollTop=0;next.disabled=false;if(step===0){content.innerHTML='<div class="intro"><div class="music">♫</div><h1>SUA COMPOSIÇÃO <span class="gold">VIROU MÚSICA!</span></h1><p class="muted">Você escreve músicas? Agora pode ouvir suas composições ganhando vida! <b>Transforme suas letras e melodias em músicas profissionais</b>, com arranjos, instrumentos e acabamento de qualidade.</p><p class="muted">Escolha <b>voz de inteligência artificial</b> ou <b>sua própria voz</b>. Produção por <b>Rico Dias, músico com 20 anos de experiência</b>.</p><p class="muted">Receba sua produção em <b>WAV</b>, preparada para divulgação no <b>YouTube e plataformas digitais</b>, respeitando direitos autorais e exigências de publicação.</p></div>';next.textContent='QUERO TRANSFORMAR MINHA COMPOSIÇÃO EM MÚSICA →';next.onclick=()=>{markFunnel('IniciouQuiz','inicio');step=1;render()}}if(step===1){content.innerHTML='<h2>O que você já tem da sua composição?</h2><div class="options">'+option('Tenho somente a letra','Ainda não tenho melodia gravada','Somente a letra',answers.material==='Somente a letra')+option('Tenho letra e melodia','Já sei como minha música deve ser cantada','Letra e melodia',answers.material==='Letra e melodia')+'</div>';bind('material');next.textContent='CONTINUAR →';next.disabled=!answers.material;next.onclick=()=>{step=2;render()}}if(step===2){content.innerHTML='<h2>Como você quer transformar sua composição em música?</h2><div class="options">'+option('R$ '+money('A')+' — Voz IA + playback profissional','Música com voz de inteligência artificial + playback profissional. 3 prévias em até 12 horas.','A',answers.package==='A')+option('R$ '+money('B')+' — Sua voz + playback profissional','Música completa com sua voz real + playback profissional, tratamento vocal, mixagem e masterização. Até 5 dias corridos.','B',answers.package==='B')+'</div><p class="muted" style="font-size:.83rem">Para o pacote com sua própria voz, será necessário enviar uma gravação vocal. Você receberá orientações pelo WhatsApp.</p>';bind('package');next.textContent='VER MEU PACOTE →';next.disabled=!answers.package;next.onclick=()=>{step=3;render()}}if(step===3){content.innerHTML='<h2>Qual estilo musical você deseja?</h2><div class="grid">'+genres.map(x=>option(x,'',x,answers.style===x)).join('')+'</div>'+(answers.style&&!genres.includes(answers.style)?'<input id="other" class="field" placeholder="Descreva o estilo" maxlength="70" value="'+esc(answers.style)+'">':'')+'<p class="muted" style="font-size:.8rem">Se escolher Outro estilo, você poderá escrever o nome.</p>';content.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{if(b.dataset.value==='Outro estilo'){answers.style='';content.innerHTML='<h2>Qual estilo musical você deseja?</h2><input class="field" id="other" maxlength="70" placeholder="Digite o estilo musical" autofocus><p class="muted">Ex.: jazz, música regional ou outro gênero.</p>';const field=document.getElementById('other');field.focus();field.oninput=()=>{answers.style=field.value.trim();next.disabled=!answers.style}}else{answers.style=b.dataset.value;markFunnel('EscolheuEstilo',answers.style);render()}});if(document.getElementById('other'))document.getElementById('other').oninput=e=>{answers.style=e.target.value.trim();next.disabled=!answers.style};next.textContent='VER MINHA PRODUÇÃO →';next.disabled=!answers.style;next.onclick=()=>{markFunnel('EscolheuEstilo',answers.style);step=4;render()}}if(step===4){const a=answers.package==='A',price=money(answers.package);const benefits=a?['3 prévias musicais para você escolher sua favorita','Playback instrumental profissional da versão escolhida','Música completa com voz de inteligência artificial','Música e playback final em WAV']:['Playback instrumental profissional','Sua própria voz integrada à música','Tratamento vocal e ajustes de afinação quando viáveis','Equalização, mixagem e masterização','Música e playback final em WAV'];const time=a?'3 prévias em até 12 horas':'Música completa em até 5 dias corridos';const explanation=a?'O prazo para apresentar as 3 prévias é de até 12 horas após confirmação do pagamento e recebimento de todo o material necessário. Após escolher uma prévia, o prazo de finalização será informado no atendimento. A entrega inclui uma única música final e seu playback profissional em WAV. Composição de nova melodia não está incluída automaticamente.':'O prazo é de até 5 dias corridos, incluindo fins de semana e feriados, a partir do pagamento confirmado e do recebimento de todos os materiais, incluindo a sua gravação vocal. Tratamento e ajustes de afinação dependem da qualidade do áudio recebido. Gravações ruidosas podem limitar o resultado; recomendamos gravar em estúdio quando possível.';content.innerHTML='<div class="chip">'+(a?'PACOTE VOZ IA':'PACOTE SUA VOZ PROFISSIONAL')+'</div><h2 style="margin:8px 0">'+(a?'Sua composição pode virar música com voz de IA!':'Sua voz merece uma produção musical profissional!')+'</h2><div class="offer-price-row"><div class="price">R$ '+price+',00</div>'+audios()+'</div><strong class="gold">'+time+'</strong>'+benefits.map(x=>'<div class="line">'+esc(x)+'</div>').join('')+'<div class="notice">'+explanation+'</div><div class="notice">O áudio será entregue em WAV, adequado à preparação para YouTube e plataformas digitais. A publicação depende dos direitos de uso, da distribuidora e dos requisitos técnicos aplicáveis. Atendimento e envio de materiais diretamente pelo WhatsApp de Rico Dias. O quiz não cobra pagamentos nem solicita dados financeiros.</div>'+(answers.material==='Somente a letra'&&!a?'<div class="notice">Para produzir com sua própria voz, você precisará enviar uma gravação vocal e a referência de melodia. Rico Dias orientará o envio pelo WhatsApp.</div>':'');setupDemo();showOfferTrack();next.textContent=a?'QUERO MINHA MÚSICA COM VOZ DE IA — R$ 97':'QUERO PRODUZIR MINHA MÚSICA COM MINHA VOZ — R$ 250';next.disabled=false;next.onclick=whats}}back.onclick=()=>{if(step>0){step--;answers.confirmed=false;render()}};render()})();
