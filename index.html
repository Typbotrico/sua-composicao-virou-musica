<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sua Composição Virou Música | Rico Dias</title><meta name="description" content="Transforme sua letra em música profissional com Rico Dias. Voz IA ou sua própria voz."><script src="config.js"></script><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#fff;background:#0c0a16}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 70% 0%,#39205a,transparent 56%),#0c0a16;display:flex;justify-content:center;align-items:center;padding:12px}.wrap{width:min(100%,510px);background:#181126;border:1px solid #4b3b64;border-radius:21px;box-shadow:0 20px 60px #0007;display:flex;flex-direction:column;max-height:calc(100dvh - 24px);overflow:hidden}.header{padding:18px 20px 14px;flex-shrink:0}.brand{font-weight:800;letter-spacing:.06em;font-size:.83rem;color:#eac57e}.by{font-size:.78rem;color:#c4b9d0;margin-top:4px}.progress{height:4px;background:#3d3052}.progress div{height:100%;background:linear-gradient(90deg,#9354e8,#eac57e);transition:width .2s}.body{overflow-y:auto;overscroll-behavior:contain;min-height:0;flex:1;padding:22px 20px 12px}h1{font-size:clamp(1.65rem,6vw,2.1rem);line-height:1.14;margin:8px 0 15px}h2{font-size:clamp(1.3rem,5vw,1.55rem);line-height:1.24;margin:0 0 18px}.gold{color:#eac57e}.muted{color:#d0c5dc;line-height:1.48;font-size:.94rem}.options{display:grid;gap:10px}.option{width:100%;background:#291d3c;color:#fff;border:1px solid #665078;padding:15px 14px;text-align:left;border-radius:12px;font:inherit;cursor:pointer;line-height:1.3}.option.active,.option:hover{border-color:#eac57e;background:#3c2954}.option strong{display:block;margin-bottom:4px}.option small{color:#d0c5dc;display:block;font-size:.82rem;line-height:1.35}.option:focus-visible,.cta:focus-visible{outline:3px solid #eac57e;outline-offset:2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid .option{padding:12px;text-align:center}.field{width:100%;padding:14px;background:#291d3c;border:1px solid #826a98;color:white;border-radius:11px;font:inherit;margin-top:12px}.footer{flex-shrink:0;padding:12px 20px 17px;border-top:1px solid #342743;background:#181126}.cta{display:block;width:100%;border:0;border-radius:12px;background:linear-gradient(95deg,#b073ed,#eac57e);padding:15px 12px;font-size:.94rem;font-weight:850;color:#160f20;cursor:pointer}.cta:disabled{opacity:.42;cursor:not-allowed}.back{background:none;border:0;color:#bfb1ce;font:inherit;cursor:pointer;margin-top:10px;padding:4px 0}.price{font-size:2.5rem;font-weight:850;color:#eac57e;margin:8px 0}.line{padding:7px 0;line-height:1.4;font-size:.93rem}.line:before{content:'✓';color:#eac57e;margin-right:9px}.notice{padding:13px;background:#2a2038;border-radius:11px;font-size:.83rem;color:#ded5e7;line-height:1.5;margin:13px 0}.confirm{display:flex;gap:10px;align-items:flex-start;padding:11px 0;font-size:.84rem;line-height:1.45}.confirm input{accent-color:#b57bed;width:19px;height:19px;flex-shrink:0}.chip{font-size:.75rem;color:#eac57e;font-weight:800;letter-spacing:.06em}.demo{border:1px dashed #79648b;border-radius:10px;padding:12px;margin:12px 0}.demo audio{width:100%;margin-top:7px}.demo small{color:#cfc2dc}.intro{text-align:center;padding:20px 0}.intro .music{font-size:3.2rem;color:#eac57e}.fine{font-size:.76rem;color:#a99ab9;text-align:center;margin-top:9px}@media(max-height:650px){.header{padding:12px 16px 10px}.body{padding:14px 16px 7px}.footer{padding:9px 16px 12px}.intro{padding:5px 0}.intro .music{font-size:2rem}}@media(max-width:340px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="header"><div class="brand">♫ RICO DIAS • PRODUÇÃO MUSICAL</div><div class="by">20 anos de experiência no mercado musical</div></header><div class="progress"><div id="progress"></div></div><section id="content" class="body" aria-live="polite"></section><footer class="footer"><button class="cta" id="next"></button><button class="back" id="back" hidden>← Voltar</button><div class="fine">Atendimento e envio dos materiais pelo WhatsApp</div></footer></main><script>
(()=>{'use strict';const c=window.QUIZ_CONFIG||{},content=document.getElementById('content'),next=document.getElementById('next'),back=document.getElementById('back'),progress=document.getElementById('progress');const genres=['Sertanejo','Gospel','Pagode','Samba','Forró','Piseiro','Arrocha','Funk','Rap','Trap','Pop','Rock','MPB','Axé','Reggae','Eletrônico','Brega / Tecnobrega','R&B / Soul','Romântico / Bolero','Infantil','Outro estilo'];let step=0,answers={material:null,package:null,style:null,confirmed:false};const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[ch]));const money=p=>Number((c.prices||{})[p]||(p==='A'?97:250));function track(name,params){if(typeof window.fbq==='function')window.fbq('track',name,params||{})}if(/^\d{8,20}$/.test(String(c.pixelId||''))){!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');window.fbq('init',c.pixelId);track('PageView')}function option(title,desc,value,selected){return '<button type="button" class="option '+(selected?'active':'')+'" data-value="'+esc(value)+'"><strong>'+esc(title)+'</strong>'+(desc?'<small>'+esc(desc)+'</small>':'')+'</button>'}function bind(field){content.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{answers[field]=b.dataset.value;if(field==='package')answers.confirmed=false;if(field==='style'&&answers.style==='Outro estilo')answers.style='';render()})}function audios(){const items=(c.demos||{})[answers.package]||[];return '<div class="demo"><strong>Demonstrações reais</strong>'+(items.length?items.map(x=>'<div><small>'+esc(x.title)+'</small><audio controls preload="none" src="'+esc(x.url)+'"></audio></div>').join(''):'<p><small>As demonstrações serão adicionadas em breve.</small></p>')+'</div>'}function whats(){const n=String(c.whatsapp||'').replace(/\D/g,'').replace(/^55/,'');if(!/^\d{10,11}$/.test(n)){alert('WhatsApp ainda não configurado.');return}const a=answers.package==='A',price=money(answers.package);const msg=['Olá, Rico Dias! 🎵','Fiz o quiz Sua Composição Virou Música e quero iniciar minha produção.','','PACOTE: '+(a?'R$ '+price+' — MÚSICA COM VOZ DE IA E PLAYBACK':'R$ '+price+' — MÚSICA COM MINHA VOZ E PLAYBACK PROFISSIONAL'),'Material: '+answers.material,'Estilo musical: '+answers.style,'Prazo informado: '+(a?'até 12 horas para as 3 prévias após pagamento confirmado e envio do material completo; finalização após escolha da versão':'até 5 dias corridos após pagamento confirmado e envio de todos os materiais, incluindo minha voz'),'',a?'Entendi que vou escolher uma das 3 prévias e receber a música com voz de IA e o playback em WAV.':'Entendi que minha voz será integrada à produção, com tratamento vocal, mixagem, masterização e entrega em WAV.','Quero receber as orientações de pagamento e envio dos materiais pelo WhatsApp.'].join('\n');track('Contact',{content_name:'Pacote '+answers.package,value:price,currency:'BRL'});location.href='https://wa.me/55'+n+'?text='+encodeURIComponent(msg)}function render(){progress.style.width=[0,25,50,75,100][step]+'%';back.hidden=step===0;content.scrollTop=0;next.disabled=false;if(step===0){content.innerHTML='<div class="intro"><div class="music">♫</div><h1>SUA LETRA PODE VIRAR <span class="gold">UMA MÚSICA PROFISSIONAL!</span></h1><p class="muted">Você escreveu uma letra? <b>Ela pode ganhar voz, instrumentos e um playback profissional</b> — mesmo que você ainda não tenha gravado nada.</p><p class="muted">Escolha <b>voz de inteligência artificial</b> ou <b>sua própria voz</b>. Produção por <b>Rico Dias, músico com 20 anos de experiência</b>.</p><p class="muted">Receba sua produção em <b>WAV</b>, preparada para divulgação no <b>YouTube e plataformas digitais</b>, respeitando direitos autorais e exigências de publicação.</p></div>';next.textContent='QUERO OUVIR MINHA MÚSICA PRONTA →';next.onclick=()=>{step=1;render()}}if(step===1){content.innerHTML='<h2>O que você já tem da sua composição?</h2><div class="options">'+option('Tenho somente a letra','Ainda não tenho melodia gravada','Somente a letra',answers.material==='Somente a letra')+option('Tenho letra e melodia','Já sei como minha música deve ser cantada','Letra e melodia',answers.material==='Letra e melodia')+'</div>';bind('material');next.textContent='CONTINUAR →';next.disabled=!answers.material;next.onclick=()=>{step=2;render()}}if(step===2){content.innerHTML='<h2>Como você quer ouvir sua música?</h2><div class="options">'+option('R$ '+money('A')+' — Voz IA + playback profissional','Música com voz de inteligência artificial + playback profissional. 3 prévias em até 12 horas.','A',answers.package==='A')+option('R$ '+money('B')+' — Sua voz + playback profissional','Música completa com sua voz real + playback profissional, tratamento vocal, mixagem e masterização. Até 5 dias corridos.','B',answers.package==='B')+'</div><p class="muted" style="font-size:.83rem">Para o pacote com sua própria voz, será necessário enviar uma gravação vocal. Você receberá orientações pelo WhatsApp.</p>';bind('package');next.textContent='VER MEU PACOTE →';next.disabled=!answers.package;next.onclick=()=>{step=3;render()}}if(step===3){content.innerHTML='<h2>Qual estilo musical você deseja?</h2><div class="grid">'+genres.map(x=>option(x,'',x,answers.style===x)).join('')+'</div>'+(answers.style&&!genres.includes(answers.style)?'<input id="other" class="field" placeholder="Descreva o estilo" maxlength="70" value="'+esc(answers.style)+'">':'')+'<p class="muted" style="font-size:.8rem">Se escolher Outro estilo, você poderá escrever o nome.</p>';content.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{if(b.dataset.value==='Outro estilo'){answers.style='';content.innerHTML='<h2>Qual estilo musical você deseja?</h2><input class="field" id="other" maxlength="70" placeholder="Digite o estilo musical" autofocus><p class="muted">Ex.: jazz, música regional ou outro gênero.</p>';const field=document.getElementById('other');field.focus();field.oninput=()=>{answers.style=field.value.trim();next.disabled=!answers.style}}else{answers.style=b.dataset.value;render()}});if(document.getElementById('other'))document.getElementById('other').oninput=e=>{answers.style=e.target.value.trim();next.disabled=!answers.style};next.textContent='VER MINHA PRODUÇÃO →';next.disabled=!answers.style;next.onclick=()=>{step=4;track('Lead',{content_name:'Pacote '+answers.package,value:money(answers.package),currency:'BRL'});render()}}if(step===4){const a=answers.package==='A',price=money(answers.package);const benefits=a?['3 prévias musicais para você escolher sua favorita','Playback instrumental profissional da versão escolhida','Música completa com voz de inteligência artificial','Música e playback final em WAV']:['Playback instrumental profissional','Sua própria voz integrada à música','Tratamento vocal e ajustes de afinação','Equalização, mixagem e masterização','Música e playback final em WAV'];const time=a?'3 prévias em até 12 horas':'Música completa em até 5 dias corridos';const explanation=a?'O prazo das 3 prévias começa após confirmação do pagamento e recebimento do material completo. Após sua escolha, a entrega final em WAV terá prazo informado no atendimento. A entrega inclui somente a versão escolhida e seu playback profissional.':'O prazo começa após confirmação do pagamento e recebimento de todos os materiais, incluindo sua gravação vocal. Gravações feitas no celular podem limitar a qualidade final; recomendamos estúdio.';content.innerHTML='<div class="chip">'+(a?'PACOTE VOZ IA':'PACOTE SUA VOZ PROFISSIONAL')+'</div><h2 style="margin:8px 0">Sua música completa + playback profissional</h2><div class="price">R$ '+price+',00</div><strong class="gold">'+time+'</strong>'+benefits.map(x=>'<div class="line">'+esc(x)+'</div>').join('')+'<div class="notice">'+explanation+'</div><div class="notice">O áudio será entregue em WAV, adequado à preparação para YouTube e plataformas digitais. A publicação depende dos direitos de uso, da distribuidora e dos requisitos técnicos aplicáveis. Atendimento e envio de materiais diretamente pelo WhatsApp de Rico Dias. O quiz não cobra pagamentos nem solicita dados financeiros.</div>'+audios()+'<label class="confirm"><input id="accept" type="checkbox" '+(answers.confirmed?'checked':'')+'><span>Li o valor, o que está incluído e o prazo do pacote <b>R$ '+price+'</b>. Quero falar com Rico Dias no WhatsApp para iniciar.</span></label>';document.getElementById('accept').onchange=e=>{answers.confirmed=e.target.checked;next.disabled=!answers.confirmed};next.textContent='FALAR COM RICO DIAS NO WHATSAPP →';next.disabled=!answers.confirmed;next.onclick=whats}}back.onclick=()=>{if(step>0){step--;answers.confirmed=false;render()}};render()})();
</script></body></html>
