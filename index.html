</style><script src="config.js"></script></head><body><main class="shell"><header class="top"><div><div class="brand">RICO DIAS • PRODUÇÃO MUSICAL</div><div class="sub">20 anos de experiência musical</div></div><div class="symbol">♫</div></header><div class="progress"><div id="bar"></div></div><section class="content" id="app" aria-live="polite"></section><button class="back" id="back" hidden>← Voltar</button><div class="foot">Sua Composição Virou Música</div></main><script>
(()=>{'use strict';const cfg=window.QUIZ_CONFIG||{},app=document.getElementById('app'),back=document.getElementById('back'),bar=document.getElementById('bar');const styles=['Sertanejo','Gospel','Pagode','Samba','Forró','Piseiro','Arrocha','Funk','Rap','Trap','Pop','Rock','MPB','Reggae','Eletrônico','Romântico','Infantil','Outro'];const materials=['Somente uma letra escrita','Apenas uma ideia musical','Uma voz-guia gravada cantando minha música','Letra e melodia, e posso gravar minha voz'];let data={},history=[],screen='intro';const $=s=>document.querySelector(s);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function track(event,params={}){if(typeof window.fbq==='function')window.fbq('track',event,params)}if(/^\d{8,20}$/.test(cfg.pixelId||'')){!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');window.fbq('init',cfg.pixelId);track('PageView')}function go(next){history.push(screen);screen=next;render()}back.onclick=()=>{if(history.length){screen=history.pop();render()}};function opts(list,cls=''){return '<div class="options '+cls+'">'+list.map((x,i)=>'<button class="option" data-i="'+i+'">'+escape(x)+'</button>').join('')+'</div>'}function wire(list,cb){app.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>cb(list[Number(el.dataset.i)]))}function demo(){let a=(cfg.demos||{})[data.package]||[];return '<div class="demo"><strong>Demonstrações reais — pacote '+data.package+'</strong>'+(a.length?a.map(d=>'<div><p>'+escape(d.title)+'</p><audio controls preload="none" src="'+escape(d.url)+'"></audio></div>').join(''):'<p><small>Em breve: demonstrações reais deste pacote.</small></p>')+'</div>'}function finish(){const a=data.package==='A',p=(cfg.prices||{})[data.package]||(a?97:250);const benefits=a?['3 prévias musicais em até 12 horas','Escolha da versão favorita','1 playback instrumental profissional','1 música cantada por inteligência artificial','Arquivos finais em WAV']:['Playback instrumental profissional','Sua própria voz integrada à música','Tratamento e afinação vocal','Equalização profissional','Mixagem e masterização','Arquivos finais em WAV'];const notice=a?'As 12 horas começam após pagamento confirmado e envio do material completo. A entrega dos arquivos finais acontece após a escolha da versão, em prazo informado no atendimento. Ideias musicais sem material definido estão sujeitas à avaliação de viabilidade no WhatsApp.':'Prazo de até 5 dias corridos após pagamento confirmado e recebimento do material completo. Gravações pelo celular podem limitar a qualidade final; recomendamos gravação em estúdio. Arquivos preparados para distribuição digital, respeitando os requisitos técnicos e direitos aplicáveis.';app.innerHTML='<div style="text-align:center"><div class="tag">PACOTE '+data.package+'</div><h2>'+(a?'SUA COMPOSIÇÃO PODE VIRAR MÚSICA!':'SUA VOZ EM UMA PRODUÇÃO MUSICAL PROFISSIONAL!')+'</h2></div><div class="price">R$ '+p+',00</div>'+benefits.map(x=>'<div class="check">'+escape(x)+'</div>').join('')+'<div class="notice">'+notice+'</div>'+demo()+'<button class="primary" id="contact">'+(a?'QUERO MINHA MÚSICA COM IA':'QUERO PRODUZIR COM MINHA VOZ')+' — R$ '+p+'</button><p class="error" id="err"></p>';$('#contact').onclick=()=>{const number=String(cfg.whatsapp||'').replace(/\D/g,'').replace(/^55/,'');if(number.length<10||number.length>11){$('#err').textContent='Número do WhatsApp não configurado.';return}const message='Olá! Quero contratar Sua Composição Virou Música.\nMaterial: '+data.material+'\nEstilo: '+data.style+'\nPacote: '+(a?'A — Voz IA e playback':'B — Minha voz, mixagem e masterização')+'\nValor: R$ '+p+',00\n'+(a?'Melodia':'Envio da voz')+': '+data.detail+'\nPrazo: '+(a?'3 prévias em até 12 horas após pagamento e material completo; entrega final após escolha da versão':'Até 5 dias corridos após pagamento e material completo')+'\nPagamento: '+data.payment;track('Contact',{content_name:'Pacote '+data.package,value:p,currency:'BRL'});window.open('https://wa.me/55'+number+'?text='+encodeURIComponent(message),'_blank','noopener,noreferrer')}}function render(){back.hidden=!history.length;bar.style.width=({intro:0,material:17,style:34,package:50,detail:67,payment:84,result:100}[screen]||0)+'%';if(screen==='intro'){app.innerHTML='<div class="hero"><div class="note gold">♫</div><h1>VOCÊ ESCREVE MÚSICAS?<br><span class="gold">TRANSFORME SUA COMPOSIÇÃO EM UMA MÚSICA COMPLETA!</span></h1><p class="muted">Sua letra ou melodia pode ganhar vida com produção musical profissional!</p><p class="gold"><b>Rico Dias — 20 anos de experiência musical</b></p></div><button class="primary" id="start">QUERO TRANSFORMAR MINHA MÚSICA →</button>';$('#start').onclick=()=>go('material')}if(screen==='material'){app.innerHTML='<h2>O que você já tem?</h2>'+opts(materials);wire(materials,v=>{data.material=v;data.package=materials.indexOf(v)<2?'A':null;go('style')})}if(screen==='style'){app.innerHTML='<h2>Qual estilo musical deseja?</h2>'+opts(styles,'two')+'<div id="other"></div><button class="primary" id="next" disabled>Continuar →</button>';wire(styles,v=>{data.style=v;app.querySelectorAll('[data-i]').forEach(el=>el.classList.toggle('selected',el.textContent===v));$('#other').innerHTML=v==='Outro'?'<input class="field" id="custom" maxlength="60" placeholder="Digite seu estilo musical" aria-label="Outro estilo">':'';$('#next').disabled=v==='Outro';if(v==='Outro')$('#custom').oninput=e=>{data.style=e.target.value.trim();$('#next').disabled=!data.style}});$('#next').onclick=()=>go(data.package==='A'?'detail':'package')}if(screen==='package'){app.innerHTML='<h2>Como deseja produzir sua música?</h2><button class="package" id="a"><span class="tag">PACOTE A — R$ 97</span><p><strong>Voz de inteligência artificial</strong></p><p>Playback profissional e 3 prévias musicais.</p></button><button class="package" id="b"><span class="tag">PACOTE B — R$ 250</span><p><strong>Produção com minha própria voz</strong></p><p>Tratamento vocal, mixagem e masterização.</p></button>';$('#a').onclick=()=>{data.package='A';go('detail')};$('#b').onclick=()=>{data.package='B';go('detail')}}if(screen==='detail'){const a=data.package==='A',list=a?['Tenho gravada','Tenho uma referência','Só tenho a letra','Preciso de orientação']:['Já tenho gravação de estúdio','Vou gravar em estúdio','Vou gravar pelo celular ou WhatsApp','Preciso de orientação'];app.innerHTML='<h2>'+(a?'Você já tem uma melodia definida?':'Como você vai enviar sua voz?')+'</h2>'+opts(list)+demo();wire(list,v=>{data.detail=v;go('payment')})}if(screen==='payment'){const list=['Pix','Cartão de crédito por link','Quero esclarecer uma dúvida'];app.innerHTML='<h2>Como prefere pagar?</h2>'+opts(list);wire(list,v=>{data.payment=v;track('Lead',{content_name:'Pacote '+data.package,value:(cfg.prices||{})[data.package],currency:'BRL'});go('result')})}if(screen==='result')finish()}render()})();
</script></body></html>
